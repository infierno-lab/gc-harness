services:
  postgres:
    image: postgres:16
    container_name: gc-intel-postgres
    restart: unless-stopped
    # Mapped to 5433 (not 5432) to avoid clashing with a local Postgres install.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gc_intel
      POSTGRES_USER: gc_intel
      POSTGRES_PASSWORD: gc_intel
    volumes:
      - gc_intel_pgdata:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gc_intel -d gc_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gc-intel-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Inside the compose network the app reaches Postgres by service name, not
    # localhost:5433 — override whatever GC_DATABASE_URL/GC_ADMIN_DATABASE_URL
    # the repo-root .env sets for host-side `uv run`.
    environment:
      GC_DATABASE_URL: postgresql+psycopg://gc_intel:gc_intel@postgres:5432/gc_intel
      GC_ADMIN_DATABASE_URL: postgresql+psycopg://gc_intel:gc_intel@postgres:5432/gc_intel
    env_file:
      - ../.env
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn core.api.app:app --host 0.0.0.0 --port 8080"

volumes:
  gc_intel_pgdata:
