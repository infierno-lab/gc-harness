# --- compound-intent regression: extra directive tacked onto a stage-0 shape ---
#
# LIVE BUG (confirmed via the API): the old, unanchored "run elasticity" rule
# swallowed this ask into the plain pipeline shape, dropping "...and promote
# the model to champion" -- normalized_hash then collided with the plain
# elasticity ask, cross-binding the plan-template cache. Anchoring stage-0
# end-to-end (core/classify/rules.py) sends this correctly to stage 2.

- id: regression_compound_elasticity_and_promote
  text: "run elasticity for demo on blinkit for Jan to Feb and promote the model to champion"
  expect:
    task_type: pipeline
    stage: llm
    entities:
      brand: demo
      platform: blinkit
      window: {from: "2026-01", to: "2026-02"}
    min_confidence: 0.5
  # valid: false is the CORRECT, deterministic outcome here (not flaky) --
  # promote_model is mutate_state, so validate_plan's sideeffect_policy check
  # fires unconditionally at plan time (plan_ask never holds an approver
  # role; that's the two-person approval flow, downstream). What matters,
  # and what was verified across 3 independent live planning calls before
  # adding this, is that promote_model is reliably present in the composed
  # plan -- the planner's intent-coverage guard (core/plan/planner.py) fails
  # the ask honestly (intent_unserved) if it ever isn't.
  plan_expect:
    valid: false
    blocks: [panel_builder, elasticity_dml, post_model_checks, promote_model]

# --- ambiguous asks (named but unresolvable brand/platform -> code-level ambiguities) ---

- id: ambiguous_unknown_brand_platform_pipeline
  text: "Please compute elasticity for nivea on bigbasket"
