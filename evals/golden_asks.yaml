# Golden-ask corpus (spec §9 Evals / §12 PoC scope "golden-ask suite (~30)").
#
# Every entry: {id, text, expect, plan_expect?}
#   expect:
#     task_type            — exact NormalizedAsk.task_type match (omit for out_of_domain entries)
#     out_of_domain: true   — accepts task_type "unknown" OR confidence < 0.5 (used instead of task_type)
#     stage                — "rules" | "llm", when the classifier ladder stage is pinned
#     entities              — subset of Entities fields to assert (brand/platform/window/
#                             price_delta_pct/budget/metric); a null asserts that field IS None
#     ambiguities_contains  — substrings (case-insensitive) that must each appear in some
#                             ambiguity string
#     min_confidence        — floor on NormalizedAsk.confidence
#   plan_expect (only for asks whose plan family is deterministic given the catalog):
#     valid  — expected ValidationResult.valid
#     blocks — expected block *names* (version stripped) in topo order

- id: stage0_run_elasticity_pipeline
  text: "Run elasticity for demo on blinkit for Jan-Jun 2026"
  expect:
    task_type: pipeline
    stage: rules
    entities:
      brand: demo
      platform: blinkit
      window: {from: "2026-01", to: "2026-06"}
  plan_expect:
    valid: true
    blocks: [panel_builder, elasticity_dml, post_model_checks]

- id: stage0_run_elasticity_zepto_h1
