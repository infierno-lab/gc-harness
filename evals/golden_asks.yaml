      platform: null
    ambiguities_contains: ["grofers"]

# --- out-of-domain asks ---
#
# Graceful out-of-domain handling: the stage-2 LLM answers domain: null for a
# genuinely off-topic ask (now a nullable schema field); the classifier maps
# that deterministically to task_type="unknown", confidence 0.0, and an
# ambiguity explaining why — never a raised GatewayError, and the planner
# (core/plan/planner.py) short-circuits before spending an LLM call on it
# (checked via `plan_skip_check` below, which asserts the gateway is never
# touched).

- id: ood_weather
  text: "What's the weather like in Mumbai today?"
  expect:
    task_type: unknown
    stage: llm
    entities:
      brand: null
      platform: null
      window: null
      price_delta_pct: null
      budget: null
      metric: null
    max_confidence: 0.3
    ambiguities_contains: ["Demand Intelligence"]
  plan_skip_check: true

- id: ood_poem
  text: "Can you write me a poem about SKUs?"
  expect:
    task_type: unknown
    stage: llm
    max_confidence: 0.3
    ambiguities_contains: ["Demand Intelligence"]
  plan_skip_check: true

- id: ood_flight
  text: "Book a flight to Singapore for next week."
  expect:
    task_type: unknown
    stage: llm
    max_confidence: 0.3
    ambiguities_contains: ["Demand Intelligence"]
  plan_skip_check: true
